<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#d9d9d9;overflow:hidden;font:10pt Arial,"Segoe UI",sans-serif;color:#000}
body{display:flex;flex-direction:column}
#mbar{display:none;flex:none;background:#f0f0f0;border-bottom:1px solid #aaa;overflow-x:auto;white-space:nowrap}
#root{position:relative;flex:1;min-height:0;width:100%;overflow:auto;background:#d9d9d9}
.k{position:relative;min-width:0}
.lab{display:flex;align-items:center;justify-content:center;white-space:pre-line}
.lab img{max-width:100%;pointer-events:none}
button.b{font:inherit;background:#d9d9d9;border:2px solid;border-color:#fff #777 #777 #fff;padding:3px 8px;color:inherit;border-radius:0}
button.b:active{border-color:#777 #fff #fff #777;background:var(--abg,#d9d9d9);color:var(--afg,inherit)}
button.b:disabled{color:#888}
input.e,textarea.e,select.e{font:inherit;background:#fff;border:2px solid;border-color:#777 #fff #fff #777;padding:2px;color:#000;border-radius:0;outline:0;max-width:100%}
textarea.e{resize:none}
.lb{background:#fff;border:2px solid;border-color:#777 #fff #fff #777;overflow:auto;color:#000}
.lb div{padding:1px 4px;white-space:pre}
.lb .s{background:var(--selbg,#4a6984);color:var(--selfg,#fff)}
fieldset{border:2px groove #bbb;margin:0;padding:2px;min-width:0}
.top{position:fixed;inset:0;background:#d9d9d9;z-index:50;display:flex;flex-direction:column}
.top .tb{background:#444;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;flex:none}
.top .mb{display:none;flex:none;background:#f0f0f0;border-bottom:1px solid #aaa;overflow-x:auto;white-space:nowrap}
.top .tc{flex:1;position:relative;overflow:auto}
/* ttk look */
.tt.b,button.tt{background:#e8e8e8;border:1px solid #adadad;border-radius:3px;padding:4px 10px}
button.tt:active{background:var(--abg,#cfcfcf)}
input.tt,select.tt{border:1px solid #8a8a8a;border-radius:2px;padding:3px 4px}
.tt.nb .nbh .nbt{background:#e0e0e0}
/* text widget (overlay for tags) */
.tx{overflow:auto;background:#fff;border:2px solid;border-color:#777 #fff #fff #777}
.tx .cell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.tx .tp,.tx .ta{grid-area:1/1;margin:0;padding:2px;font:inherit;white-space:pre-wrap;overflow-wrap:break-word;border:0;outline:0;background:transparent;min-width:0;width:100%;line-height:1.3;tab-size:8}
.tx .tp{pointer-events:none;color:inherit;display:none}
.tx .ta{resize:none;overflow:hidden;color:inherit;position:relative;z-index:1}
.tx.ov .tp{display:block}
.tx.ov .ta{color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ic,#000)}
.tx .ta::selection{background:var(--selbg,#4a698499)}
.tx.nw .tp,.tx.nw .ta{white-space:pre;overflow-wrap:normal}
/* scale */
.sc{display:flex;flex-direction:column;align-items:stretch}
.sc.v{flex-direction:row;align-items:center}
.sc input{margin:2px 4px}
.sc.v input{writing-mode:vertical-lr;direction:ltr}
/* scrollbar */
.sb{background:#e6e6e6;position:relative;touch-action:none;flex:none}
.sb.v{width:18px;height:100%}.sb.h{height:18px;width:100%}
.sb .th{position:absolute;background:#9a9a9a;border-radius:3px;min-width:14px;min-height:14px}
.sb.v .th{left:2px;right:2px}.sb.h .th{top:2px;bottom:2px}
/* canvas */
.cvh{overflow:auto;scrollbar-width:none;touch-action:none}
.cvh::-webkit-scrollbar{display:none}
.cvh .inner{position:relative}
.cvh svg{position:absolute;left:0;top:0;overflow:hidden}
.cvh .layer{position:absolute;left:0;top:0;width:0;height:0}
/* tree */
.tv{background:#fff;border:2px solid;border-color:#777 #fff #fff #777;overflow:auto;color:#000;font-size:inherit;position:relative}
.tv .th{display:grid;position:sticky;top:0;background:var(--hbg,#e6e6e6);color:var(--hfg,#000);z-index:2;border-bottom:1px solid #aaa;min-width:max-content}
.tv .th div{padding:3px 6px;border-right:1px solid #ccc;overflow:hidden;white-space:nowrap;font:var(--hfont,inherit);font-weight:600}
.tv .tr{display:grid;min-width:max-content;height:var(--rh,22px);align-items:center;border-bottom:1px solid #0000}
.tv .tr div{padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tv .tr.s{background:var(--selbg,#4a6984);color:var(--selfg,#fff)}
.tv .tg{display:inline-block;width:14px;text-align:center;cursor:pointer}
/* notebook / pane */
.nb{display:flex;flex-direction:column}
.nbh{display:flex;flex:none;overflow-x:auto;background:#cfcfcf}
.nbt{padding:6px 14px;white-space:nowrap;border:1px solid #999;border-bottom:0;background:#c8c8c8;margin-right:2px}
.nbt.on{background:#d9d9d9;font-weight:600}
.nbc{flex:1;min-height:0;position:relative;overflow:auto;border:1px solid #999}
.pn{display:flex;overflow:hidden}
.pn.h{flex-direction:row}.pn.v{flex-direction:column}
.pn>.sash{flex:none;background:#999;touch-action:none}
.pn.h>.sash{width:6px;cursor:col-resize}.pn.v>.sash{height:6px;cursor:row-resize}

#mscrim{display:none;position:fixed;inset:0;z-index:150}
.mi{padding:10px 16px;white-space:nowrap;display:flex;gap:10px;align-items:center;color:#000}
.mi:active{background:#cde}.mi.off{color:#999}.mi .ac{margin-left:auto;padding-left:20px;color:#666;font-size:.85em}
.mi .ck{width:14px;display:inline-block}
.mpop{position:fixed;background:#f4f4f4;border:1px solid #888;box-shadow:0 4px 12px #0005;z-index:160;max-height:80vh;overflow:auto;min-width:140px}
.mpop hr{margin:2px 0;border:0;border-top:1px solid #bbb}
.mbt{display:inline-block;padding:10px 14px;color:#000}.mbt:active,.mbt.on{background:#cde}
/* dialogs */
#dlg{position:fixed;inset:0;background:#0006;z-index:300;display:flex;align-items:center;justify-content:center}
#dlg .m{background:#f0f0f0;padding:16px;min-width:240px;max-width:90%;max-height:90%;border-radius:4px;color:#000;display:flex;flex-direction:column}
#dlg .m b{display:block;margin-bottom:8px}
#dlg .m p{margin:0 0 12px;white-space:pre-wrap}
#dlg .m input[type=text],#dlg .m input[type=password]{width:100%;margin-bottom:10px;font:inherit;padding:6px}
#dlg .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
#dlg button{font:inherit;padding:8px 16px}
#dlg .fl{overflow:auto;border:1px solid #999;background:#fff;height:46vh;min-width:260px}
#dlg .fl div{padding:8px 10px;border-bottom:1px solid #eee;white-space:nowrap}
#dlg .fl div.sel{background:#4a6984;color:#fff}
#dlg .pth{font-size:12px;color:#333;margin-bottom:6px;word-break:break-all}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0}.sw i{display:block;height:28px;border:1px solid #888}
.nb{width:100%;min-width:0;max-width:100%}.nbc{min-width:0;max-width:100%}.nbh{min-width:0;max-width:100%}
.spw{display:inline-flex;align-items:stretch}.spw input{flex:1;min-width:0}
.spw .ar{display:flex;flex-direction:column}.spw .ar b{flex:1;display:flex;align-items:center;padding:0 8px;font-size:9px;border:1px solid #888;background:#e8e8e8;color:#000;user-select:none}.spw .ar b:active{background:#bbb}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:28px}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#b5b5b5;border:1px solid #888;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;margin-top:-10px;background:#ececec;border:2px solid;border-color:#fff #777 #777 #fff;border-radius:2px}
.sc.v input[type=range]::-webkit-slider-runnable-track{width:8px;height:auto}
.sc.v input[type=range]::-webkit-slider-thumb{margin-top:0;margin-left:-10px;width:26px;height:22px}
