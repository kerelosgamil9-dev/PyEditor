<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pyvora</title>
<style>
:root{--bg:#1e1e1e;--bar:#252526;--fg:#d4d4d4;--mut:#858585;--sel:#264f78;--ac:#0e639c;--ebg:#1e1e1e;--efg:#d4d4d4;--emut:#858585;--esel:#264f78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
.bar,.keys,#tabs,.wrap{direction:ltr}
.bar{display:flex;align-items:center;background:var(--bar);gap:2px;padding:4px;overflow-x:auto}
.bar button,.keys button{flex:none;background:none;border:0;color:var(--fg);font-size:18px;min-width:40px;height:40px;border-radius:6px}
.bar button:active,.keys button:active{background:var(--sel)}
.bar .run{background:var(--ac);color:#fff;margin-right:6px}
#tabs{display:flex;overflow-x:auto;background:var(--bar);border-top:1px solid #0003}
.tab{padding:8px 12px;white-space:nowrap;color:var(--mut);font-size:14px;display:flex;gap:8px;align-items:center;border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-bottom-color:var(--ac);background:var(--bg)}
.tab b{font-weight:400;opacity:.6;padding:0 4px}
.wrap{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;background:var(--ebg)}
.cell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%;--gw:2ch}
.cm{font:var(--fs,15px)/1.55 "Roboto Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;margin:0;padding:8px 14px 120px calc(var(--gw) + 24px);grid-area:1/1;min-width:0;letter-spacing:0}
#hl{pointer-events:none;position:relative;z-index:2;color:var(--efg);counter-reset:ln;background:linear-gradient(#8887,#8887) calc(var(--gw) + 16px) 0/1px 100% no-repeat}
.l{position:relative}
.l::before{counter-increment:ln;content:counter(ln);position:absolute;top:0;left:calc(-1*(var(--gw) + 14px));width:var(--gw);text-align:right;color:var(--emut);-webkit-user-select:none}
#ed{position:relative;z-index:1;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--efg);border:0;outline:0;resize:none;overflow:hidden;width:100%}
#ed::selection{background:var(--esel);-webkit-text-fill-color:transparent}
.kw{color:var(--kw)}.bi{color:var(--bi)}.st{color:var(--st)}.nu{color:var(--nu)}.cm_{color:var(--cm);font-style:italic}.fn{color:var(--fn)}.cl{color:var(--cl)}.dc{color:var(--dc)}.cn{color:var(--cn)}.sf{color:var(--sf)}.op{color:var(--op)}
.keys{display:flex;background:var(--bar);border-top:1px solid #0003}
#kt{display:flex;flex:none;border-right:1px solid #8884}
#kb{display:flex;flex:1;overflow-x:auto}
.keys button{flex:none;font:16px ui-monospace,monospace;min-width:40px}
#kt button{min-width:46px;font-weight:700}
#kt button.on{background:var(--sel)}
#scrim{display:none;position:fixed;inset:0;background:#0007;z-index:20}
#scrim.show{display:block}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(78%,300px);background:var(--bar);z-index:21;transform:translateX(-105%);transition:transform .2s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);direction:ltr}
#drawer.show{transform:none}
.dh{display:flex;align-items:center;gap:12px;padding:20px 16px;font-size:20px;font-weight:600;border-bottom:1px solid #8884}
#drawer button{display:flex;align-items:center;gap:16px;background:none;border:0;color:var(--fg);font-size:16px;padding:14px 18px;width:100%;text-align:start}
#drawer button:active{background:var(--sel)}
#modal{display:none;position:fixed;inset:0;background:#0008;z-index:9;align-items:center;justify-content:center}
#modal.show{display:flex}
.box{background:var(--bar);border-radius:12px;padding:16px;width:min(90%,360px);max-height:90vh;overflow-y:auto}
.cell.vm .cm{white-space:pre;overflow-wrap:normal}.cell.vm{min-width:calc(var(--gw) + 60px + var(--mx,40)*1ch)}.wrap.vm{overflow-x:auto}
.wrapbox{position:relative;flex:1;min-height:0;display:flex}
#fth{position:absolute;right:0;top:0;width:34px;height:60px;display:none;opacity:0;pointer-events:none;touch-action:none;transition:opacity .25s;z-index:6;direction:ltr}
#fth::after{content:"";position:absolute;right:5px;top:0;bottom:0;width:8px;border-radius:5px;background:var(--ac);box-shadow:0 0 0 1px #0006;transition:width .15s}
#fth.show{opacity:1;pointer-events:auto}#fth.drag::after{width:16px}
.tab.add{position:sticky;right:0;background:var(--bar);font-size:22px;padding:2px 16px;color:var(--fg);flex:none}
#dlg2{display:none;position:fixed;inset:0;background:#000a;z-index:40;align-items:center;justify-content:center}
#dlg2.show{display:flex}
#dB{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#dB button{padding:12px;border:0;border-radius:8px;background:var(--sel);color:var(--fg);font-size:16px}
#dB button.danger{background:#b3261e;color:#fff}#dB button.pri{background:var(--ac);color:#fff}
#cust{display:none;grid-template-columns:1fr 1fr;gap:6px 12px;padding:4px 0}
#cust.show{display:grid}
#cust label{padding:2px 0;font-size:13px}
#cust input{width:44px;height:30px;border:0;padding:0;background:none}
.box label{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:15px}
.box select,.box input[type=number]{background:var(--bg);color:var(--fg);border:1px solid #8886;border-radius:6px;padding:6px;font-size:15px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:10;font-size:14px}

 const p=S.syn==="Custom"?S.custom:Object.fromEntries(SK.map((k,i)=>[k,SYN[S.syn].split(" ")[i]]));
 SK.forEach(k=>r.setProperty("--"+(k==="fg"?"efg":k),p[k]))}

/* ---------- Python highlighter ---------- */
const KW=new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
const BI=new Set("abs all any ascii bin bool breakpoint bytearray bytes callable chr classmethod compile complex delattr dict dir divmod enumerate eval exec filter float format frozenset getattr globals hasattr hash help hex id input int isinstance issubclass iter len list locals map max memoryview min next object oct open ord pow print property range repr reversed round set setattr slice sorted staticmethod str sum super tuple type vars zip Exception ValueError TypeError KeyError IndexError OSError ImportError NameError AttributeError RuntimeError StopIteration ZeroDivisionError FileNotFoundError".split(" "));
const RX=/(#[^\n]*)|((?:[rRbBfFuU]{1,2})?(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?))|(@[A-Za-z_][\w.]*)|(0[xXoObB][\da-fA-F_]+|\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?j?|\.\d+)|([A-Za-z_\u0080-\uFFFF][\w\u0080-\uFFFF]*)|([\s\S])/g;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function hlLines(src){
 const L=[""];let prev="",m;RX.lastIndex=0;
 const add=(c,x)=>x.split("\n").forEach((p,i)=>{if(i)L.push("");if(p)L[L.length-1]+=c?`<span class="${c}">${esc(p)}</span>`:esc(p)});
 while((m=RX.exec(src))){
  const x=m[0];let c="";
  if(m[1])c="cm_";else if(m[2])c="st";else if(m[3])c="dc";else if(m[4])c="nu";
  else if(m[5]){
   if(prev==="def")c="fn";else if(prev==="class")c="cl";
   else if(KW.has(x))c=/^(True|False|None)$/.test(x)?"cn":"kw";
   else if(x==="self"||x==="cls")c="sf";
   else if(BI.has(x)||/^__\w+__$/.test(x))c="bi";
   else if(src[RX.lastIndex]==="(")c="fn";
   prev=x;add(c,x);continue;
  }else if(/[+\-*\/%=<>!&|^~]/.test(x))c="op";
  add(c,x);if(!/^\s$/.test(x))prev="";
 }
 return L;
}
const wrapLine=l=>`<div class="l">${l||"\u200b"}</div>`;
function highlight(src){return hlLines(src).map(wrapLine).join("")}

/* ---------- editor ---------- */
const ed=$("ed"),hl=$("hl"),cell=$("cell");
/* Big files: only the lines on screen are drawn (fixed line height, no wrapping) so pasting thousands of lines stays fast */
const VL=12000,VN=700,wrapEl=document.querySelector(".wrap");
let vm=false,wa=0,wb=0,curL=[""],LH=23,rhT=0;
function setVm(on){if(on===vm)return;vm=on;cell.classList.toggle("vm",on);wrapEl.classList.toggle("vm",on);
 if(!on){hl.style.paddingTop="";hl.style.paddingBottom="";hl.style.counterReset="";cell.style.removeProperty("--mx")}}
function paintVm(force){const L=curL,N=L.length,vis=Math.ceil(wrapEl.clientHeight/LH)+2,first=Math.max(0,Math.floor((wrapEl.scrollTop-8)/LH));
 if(!force&&first-10>=wa&&first+vis+10<=wb)return;
 const a=Math.max(0,first-40),b=Math.min(N,first+vis+40);
 hl.style.paddingTop=(8+a*LH)+"px";hl.style.paddingBottom=(120+(N-b)*LH)+"px";hl.style.counterReset="ln "+a;
 hl.innerHTML=hlLines(L.slice(a,b).join("\n")).map(wrapLine).join("");wa=a;wb=b}
function render(){
 const v=ed.value;let n=1,i=-1,ls=0,mx=0;
 while((i=v.indexOf("\n",ls))>=0){if(i-ls>mx)mx=i-ls;n++;ls=i+1}if(v.length-ls>mx)mx=v.length-ls;
 cell.style.setProperty("--gw",Math.max(2,String(n).length)+"ch");
 if(v.length>VL||n>VN){setVm(true);const g=parseFloat(getComputedStyle(ed).lineHeight);LH=g>0?g:S.size*1.55;
  curL=v.split("\n");cell.style.setProperty("--mx",mx);paintVm(true)}
 else{setVm(false);hl.innerHTML=highlight(v)}
 S.tabs[S.cur].code=v;save();
}
wrapEl.addEventListener("scroll",()=>{if(vm&&!rhT)rhT=requestAnimationFrame(()=>{rhT=0;paintVm(false)})},{passive:true});
/* fast scroll bar: shows while scrolling, hides after 3 seconds */
const fth=$("fth");let fhide=0,fdrag=null;
function fsUpdate(){const sh=wrapEl.scrollHeight,ch=wrapEl.clientHeight;if(sh<=ch+4){fth.style.display="none";return false}fth.style.display="block";
 const th=Math.max(60,ch*ch/sh),tr=ch-th;fth.style.height=th+"px";fth.style.top=(wrapEl.scrollTop/(sh-ch)*tr)+"px";return true}
function fsShow(){if(!fsUpdate())return;fth.classList.add("show");clearTimeout(fhide);if(!fdrag)fhide=setTimeout(()=>fth.classList.remove("show"),3000)}
wrapEl.addEventListener("scroll",fsShow,{passive:true});
fth.addEventListener("pointerdown",e=>{e.preventDefault();fth.setPointerCapture(e.pointerId);fdrag={y:e.clientY,top:parseFloat(fth.style.top)||0};fth.classList.add("drag","show");clearTimeout(fhide)});
fth.addEventListener("pointermove",e=>{if(!fdrag)return;const sh=wrapEl.scrollHeight,ch=wrapEl.clientHeight,tr=ch-fth.offsetHeight;if(tr<=0)return;
 const t=Math.max(0,Math.min(tr,fdrag.top+e.clientY-fdrag.y));wrapEl.scrollTop=t/tr*(sh-ch)});
const fend=()=>{fdrag=null;fth.classList.remove("drag");fsShow()};fth.addEventListener("pointerup",fend);fth.addEventListener("pointercancel",fend);
/* Keyboards paste long text as many fast events (one per line): render at most a few times a second */
let lastR=0,rT=0,rCost=30;
function doRender(){const t0=performance.now();render();lastR=performance.now();rCost=lastR-t0}
function renderSoon(){S.tabs[S.cur].code=ed.value;if(rT)return;const wait=lastR+Math.max(70,rCost*2.5)-performance.now();
 if(wait<=0)doRender();else rT=setTimeout(()=>{rT=0;doRender()},wait)}
ed.addEventListener("input",renderSoon);
let lastBI=0;
const ins=s=>{ed.focus();document.execCommand("insertText",false,s)};
ed.addEventListener("beforeinput",e=>{
 const nowBI=performance.now(),fast=nowBI-lastBI<90;lastBI=nowBI;
 if(e.isComposing)return;
 if(e.inputType==="insertLineBreak"||e.inputType==="insertParagraph"){
  if(fast)return; /* part of a paste: keep the text exactly as it is (no auto indent) */
  e.preventDefault();
  const p=ed.selectionStart,b=ed.value.slice(0,p),line=b.slice(b.lastIndexOf("\n")+1);
  let ind=line.match(/^[ \t]*/)[0];
  if(/:\s*$/.test(line))ind+="    ";
  ins("\n"+ind);return;
 }
 if(e.inputType==="insertText"&&S.auto&&e.data&&e.data.length===1){
  const pairs={"(":")","[":"]","{":"}",'"':'"',"'":"'"},c=e.data,nx=ed.value[ed.selectionStart];
  if(")]}\"'".includes(c)&&nx===c&&ed.selectionStart===ed.selectionEnd){e.preventDefault();ed.setSelectionRange(ed.selectionStart+1,ed.selectionStart+1);return}
  if(pairs[c]&&(!nx||/[\s)\]}:,]/.test(nx))&&ed.selectionStart===ed.selectionEnd){
   const prev=ed.value[ed.selectionStart-1];
   if((c==='"'||c==="'")&&prev&&/[\w\u0080-\uFFFF]/.test(prev))return;
   e.preventDefault();ins(c+pairs[c]);ed.setSelectionRange(ed.selectionStart-1,ed.selectionStart-1);
  }
 }
});
ed.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();e.shiftKey?dedent():ins("    ")}});
function dedent(){const p=ed.selectionStart,s=ed.value.lastIndexOf("\n",p-1)+1,m=ed.value.slice(s).match(/^( {1,4}|\t)/);if(m){ed.setSelectionRange(s,s+m[0].length);ins("")}}
function load(){ed.value=S.tabs[S.cur].code;render();drawTabs()}
function drawTabs(){
 const el=$("tabs");el.innerHTML="";
 S.tabs.forEach((tb,i)=>{const d=document.createElement("div");d.className="tab"+(i===S.cur?" on":"");
  d.innerHTML=`<span>${esc(tb.name)}</span><b>✕</b>`;
  d.onclick=ev=>{if(ev.target.tagName==="B")closeTab(i);else{S.cur=i;load()}};
  el.appendChild(d)});
 const a=document.createElement("div");a.className="tab add";a.textContent="＋";a.onclick=addTab;el.appendChild(a);
 const on=el.querySelector(".tab.on");if(on)on.scrollIntoView({inline:"nearest",block:"nearest"});
}
function addTab(){S.tabs.push(newTab());S.cur=S.tabs.length-1;load();save();ed.focus()}
function ask(title,msg,btns){return new Promise(res=>{$("dT").textContent=title;$("dM").textContent=msg;const b=$("dB");b.innerHTML="";
 btns.forEach(([l,v,c])=>{const x=document.createElement("button");x.textContent=l;if(c)x.className=c;x.onclick=()=>{$("dlg2").classList.remove("show");res(v)};b.appendChild(x)});
 $("dlg2").classList.add("show")})}
/* saves the tab on the phone; returns true when finished (false = waiting for the system save dialog) */
function saveTab(tb){const a=A();if(!a){toast(t("nopy"));return false}
 let r="";try{r=a.quickSave(tb.name,tb.code,tb.path||"")}catch(e){}
 if(r){tb.path=r;save();toast(t("saved")+r);return true}
 toast(t("noperm"));a.saveAs(tb.name,tb.code);return true}
async function closeTab(i){if(i===S.cur)S.tabs[i].code=ed.value;const tb=S.tabs[i];
 if(tb.code.trim()){const r=await ask(t("closeT"),t("closeM").replace("%",tb.name),[[t("del"),"del","danger"],[t("sv"),"save","pri"],[t("cancel"),"cancel"]]);
  if(r!=="del"&&r!=="save")return;
  if(r==="save"&&!saveTab(tb))return}
 S.tabs.splice(i,1);if(!S.tabs.length)S.tabs.push(newTab());
 if(i<S.cur)S.cur--;S.cur=Math.max(0,Math.min(S.cur,S.tabs.length-1));load();save()}

/* ---------- keys bar ---------- */
const SYM=["Tab","(",")","[","]","{","}",'"',"'",":","=","#","_",".",",","+","-","*","/","%","<",">","!","&","|","\\","@","$"];
const KWS=["if","elif","else","for","while","return","import","from","def","print","input","class","try","except","in","and","or","not","True","False","None","range","len","int","str","with","as","pass","break","continue","self"];
const FN=new Set(["print","input","range","len","int","str"]),COL=new Set(["else","try"]);
let kmode="sym";
function insKw(k){if(FN.has(k)){ins(k+"()");ed.setSelectionRange(ed.selectionStart-1,ed.selectionStart-1)}else ins(COL.has(k)?k+":":k+" ")}
function drawKeys(){
 const kb=$("kb");kb.innerHTML="";
 (kmode==="sym"?SYM:KWS).forEach(k=>{const b=document.createElement("button");b.textContent=k==="Tab"?"⇥":k;
  b.addEventListener("pointerdown",e=>e.preventDefault());
  b.onclick=()=>kmode==="sym"?ins(k==="Tab"?"    ":k):insKw(k);kb.appendChild(b)});
 document.querySelectorAll("#kt button").forEach(b=>b.classList.toggle("on",b.dataset.k===kmode))}
document.querySelectorAll("#kt button").forEach(b=>{b.addEventListener("pointerdown",e=>e.preventDefault());b.onclick=()=>{kmode=b.dataset.k;drawKeys()}});
drawKeys();

/* ---------- actions ---------- */
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
window.onFile=(name,code)=>{S.tabs.push({name,code,path:""});S.cur=S.tabs.length-1;load()};
const A=()=>window.Android||null;
const need=f=>A()?f(A()):toast(t("nopy"));
$("bRun").onclick=()=>need(a=>a.run(ed.value,S.tabs[S.cur].name));
$("bOpen").onclick=()=>need(a=>a.openFile());
$("bUndo").onclick=()=>{ed.focus();document.execCommand("undo")};
$("bRedo").onclick=()=>{ed.focus();document.execCommand("redo")};
const menu=on=>{$("drawer").classList.toggle("show",on);$("scrim").classList.toggle("show",on)};
$("bMenu").onclick=()=>menu(true);$("scrim").onclick=()=>menu(false);
document.querySelectorAll("#drawer button").forEach(b=>b.onclick=()=>{menu(false);const a=b.dataset.a;
 if(a==="new")addTab();
 else if(a==="save"){const tb=S.tabs[S.cur];tb.code=ed.value;need(()=>saveTab(tb))}
 else if(a==="perm")need(x=>{x.grantStorage()});
 else if(a==="term")need(x=>x.terminal());
 else if(a==="pip")need(x=>x.pip());
 else $("modal").classList.add("show")});

/* ---------- settings ---------- */
$("oTheme").innerHTML=Object.keys(EDT).map(k=>`<option>${k}</option>`).join("");
$("oSyn").innerHTML=Object.keys(SYN).map(k=>`<option>${k}</option>`).join("")+`<option value="Custom"></option>`;
function drawCust(){const c=$("cust");c.classList.toggle("show",S.syn==="Custom");c.innerHTML="";
 SK.forEach((k,i)=>{const l=document.createElement("label"),sp=document.createElement("span"),inp=document.createElement("input");sp.textContent=SKN[S.lang][i];inp.type="color";inp.value=S.custom[k];
  inp.oninput=()=>{S.custom[k]=inp.value;applyTheme();save()};l.append(sp,inp);c.appendChild(l)})}
function applySettings(){
 applyTheme();
 const r=document.documentElement;
 r.style.setProperty("--fs",S.size+"px");r.lang=S.lang;r.dir=S.lang==="ar"?"rtl":"ltr";
 $("sTitle").textContent=t("set");$("sLang").textContent=t("lang");$("sTheme").textContent=t("ui");$("sSyn").textContent=t("syn");$("sDir").textContent=t("dir");
 $("oSyn").querySelector("option[value=Custom]").textContent=t("custom");
 $("oDir").options[0].textContent=t("dRoot");$("oDir").options[1].textContent=t("dApp");
 document.querySelectorAll("[data-i]").forEach(x=>x.textContent=t(x.dataset.i));
 $("sSize").textContent=t("size");$("sAuto").textContent=t("auto");$("sOk").textContent=t("ok");
 $("oLang").value=S.lang;$("oTheme").value=S.ui;$("oSyn").value=S.syn;$("oDir").value=S.dir;$("oSize").value=S.size;$("oAuto").checked=S.auto;
 drawCust();drawTabs();
 try{if(A())A().setDirMode(S.dir)}catch(e){}
 save();
}
$("oTheme").onchange=()=>{S.ui=$("oTheme").value;applyTheme();save()};
$("oSyn").onchange=()=>{S.syn=$("oSyn").value;applyTheme();drawCust();save()};
$("oDir").onchange=()=>{S.dir=$("oDir").value;try{if(A())A().setDirMode(S.dir)}catch(e){}save()};
$("sOk").onclick=()=>{S.lang=$("oLang").value;S.ui=$("oTheme").value;S.syn=$("oSyn").value;S.dir=$("oDir").value;S.size=Math.min(30,Math.max(10,+$("oSize").value||15));S.auto=$("oAuto").checked;applySettings();$("modal").classList.remove("show")};
applySettings();load();
setTimeout(async()=>{const a=A();if(!a||S.noask)return;let ok=true;try{ok=a.hasStorage()}catch(e){}if(ok)return;
 const r=await ask(t("permT"),t("permM"),[[t("allow"),"y","pri"],[t("later"),"n"]]);if(r==="y")a.grantStorage();else{S.noask=true;saveNow()}},700);
</script></body></html>
