<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PyEditor</title>
<style>
:root{--bg:#1e1e1e;--bar:#252526;--fg:#d4d4d4;--mut:#858585;--sel:#264f78;--kw:#c586c0;--bi:#dcdcaa;--st:#ce9178;--nu:#b5cea8;--cm:#6a9955;--fn:#dcdcaa;--cl:#4ec9b0;--dc:#4fc1ff;--cn:#569cd6;--op:#d4d4d4;--ac:#0e639c}
[data-theme=light]{--bg:#fff;--bar:#f3f3f3;--fg:#1f1f1f;--mut:#999;--sel:#add6ff;--kw:#af00db;--bi:#795e26;--st:#a31515;--nu:#098658;--cm:#008000;--fn:#795e26;--cl:#267f99;--dc:#0070c1;--cn:#0000ff;--op:#1f1f1f;--ac:#0e639c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;background:var(--bar);gap:2px;padding:4px}
.bar button,.keys button{background:none;border:0;color:var(--fg);font-size:18px;min-width:42px;height:40px;border-radius:6px}
.bar button:active,.keys button:active{background:var(--sel)}
.bar .run{background:var(--ac);color:#fff;margin-inline-end:6px}
.sp{flex:1}
#tabs{display:flex;overflow-x:auto;background:var(--bar);border-top:1px solid #0003}
.tab{padding:8px 12px;white-space:nowrap;color:var(--mut);font-size:14px;display:flex;gap:8px;align-items:center;border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-bottom-color:var(--ac);background:var(--bg)}
.tab b{font-weight:400;opacity:.6;padding:0 4px}
.wrap{flex:1;overflow:auto;position:relative;min-height:0}
.inner{display:grid;grid-template-columns:auto 1fr;min-height:100%}
#gut{position:sticky;left:0;z-index:2;background:var(--bg);color:var(--mut);text-align:right;padding:8px 8px 8px 10px;border-right:1px solid #8884;user-select:none}
.cell{display:grid;position:relative}
.cm{font:var(--fs,15px)/1.55 "Roboto Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:4;margin:0;padding:8px 40px 80px 10px;grid-area:1/1;letter-spacing:0;word-break:normal;overflow-wrap:normal}
#gut{font:var(--fs,15px)/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
#hl{pointer-events:none;color:var(--fg)}
#ed{background:transparent;color:transparent;caret-color:var(--fg);border:0;outline:0;resize:none;overflow:hidden;width:100%;-webkit-text-fill-color:transparent}
#ed::selection{background:var(--sel);-webkit-text-fill-color:transparent}
.kw{color:var(--kw)}.bi{color:var(--bi)}.st{color:var(--st)}.nu{color:var(--nu)}.cm_{color:var(--cm);font-style:italic}.fn{color:var(--fn)}.cl{color:var(--cl)}.dc{color:var(--dc)}.cn{color:var(--cn)}.sf{color:var(--dc)}
.keys{display:flex;overflow-x:auto;background:var(--bar);border-top:1px solid #0003}
.keys button{font:16px ui-monospace,monospace;min-width:40px;flex:none}
#panel{display:none;flex-direction:column;height:38%;background:var(--bar);border-top:2px solid var(--ac)}
#panel.show{display:flex}
#panel .hd{display:flex;align-items:center;padding:2px 8px;font-size:13px;color:var(--mut)}
#out{flex:1;margin:0;padding:6px 10px;overflow:auto;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;unicode-bidi:plaintext;user-select:text}
#term{display:flex;border-top:1px solid #8884}
#term input{flex:1;background:none;border:0;outline:0;color:var(--fg);padding:8px 10px;font:14px ui-monospace,monospace}
#modal{display:none;position:fixed;inset:0;background:#0008;z-index:9;align-items:center;justify-content:center}
#modal.show{display:flex}
.box{background:var(--bar);border-radius:12px;padding:16px;width:min(90%,360px)}
.box label{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-size:15px}
.box select,.box input[type=number]{background:var(--bg);color:var(--fg);border:1px solid #8886;border-radius:6px;padding:6px;font-size:15px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:10;font-size:14px}
</style></head><body>
<div id="app">
 <div class="bar">
  <button class="run" id="bRun">▶</button>
  <button id="bNew">＋</button><button id="bOpen">📂</button><button id="bSave">💾</button>
  <span class="sp"></span>
  <button id="bUndo">↶</button><button id="bRedo">↷</button>
  <button id="bTerm">⌨</button><button id="bSet">⚙</button>
 </div>
 <div id="tabs"></div>
 <div class="wrap" id="wrap"><div class="inner">
  <div id="gut">1</div>
  <div class="cell"><pre id="hl" class="cm"></pre>
  <textarea id="ed" class="cm" wrap="off" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" dir="ltr"></textarea></div>
 </div></div>
 <div class="keys" id="keys"></div>
 <div id="panel">
  <div class="hd"><span id="tOut">Output</span><span class="sp"></span><button id="bClr" style="background:none;border:0;color:var(--mut);font-size:13px"></button><button id="bX" style="background:none;border:0;color:var(--mut);font-size:16px">✕</button></div>
  <pre id="out"></pre>
  <div id="term"><input id="ti" placeholder="pip install requests" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="bGo" style="background:none;border:0;color:var(--fg);font-size:18px;padding:0 14px">↵</button></div>
 </div>
</div>
<div id="modal"><div class="box">
 <h3 id="sTitle" style="margin:0 0 6px"></h3>
 <label><span id="sLang"></span><select id="oLang"><option value="ar">العربية</option><option value="en">English</option></select></label>
 <label><span id="sTheme"></span><select id="oTheme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
 <label><span id="sSize"></span><input type="number" id="oSize" min="10" max="30" style="width:70px"></label>
 <label><span id="sAuto"></span><input type="checkbox" id="oAuto"></label>
 <button id="sOk" style="width:100%;margin-top:8px;padding:10px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:16px"></button>
</div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const I18N={en:{run:"Run",out:"Output",clear:"Clear",set:"Settings",lang:"Language",theme:"Theme",size:"Font size",auto:"Auto-close brackets",ok:"Done",untitled:"untitled",nopy:"Runs only inside the Android app",saved:"Saved"},
ar:{run:"تشغيل",out:"المخرجات",clear:"مسح",set:"الإعدادات",lang:"اللغة",theme:"المظهر",size:"حجم الخط",auto:"إغلاق الأقواس تلقائيا",ok:"تم",untitled:"جديد",nopy:"التشغيل شغال جوه تطبيق أندرويد بس",saved:"تم الحفظ"}};
let S={tabs:[],cur:0,lang:"ar",theme:"dark",size:15,auto:true};
try{Object.assign(S,JSON.parse(localStorage.getItem("pyed")||"{}"))}catch(e){}
const t=k=>I18N[S.lang][k];
const save=()=>{try{localStorage.setItem("pyed",JSON.stringify(S))}catch(e){}};
const newTab=(name,code)=>({name:name||(t("untitled")+(S.tabs.length+1)+".py"),code:code||"print(\"Hello, World!\")\nprint(\"أهلا كلود\")\n"});
if(!S.tabs.length)S.tabs.push(newTab("main.py"));

/* ---------- Python highlighter ---------- */
const KW=new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
const BI=new Set("abs all any ascii bin bool breakpoint bytearray bytes callable chr classmethod compile complex delattr dict dir divmod enumerate eval exec filter float format frozenset getattr globals hasattr hash help hex id input int isinstance issubclass iter len list locals map max memoryview min next object oct open ord pow print property range repr reversed round set setattr slice sorted staticmethod str sum super tuple type vars zip Exception ValueError TypeError KeyError IndexError OSError ImportError NameError AttributeError RuntimeError StopIteration ZeroDivisionError FileNotFoundError".split(" "));
const RX=/(#[^\n]*)|((?:[rRbBfFuU]{1,2})?(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?))|(@[A-Za-z_][\w.]*)|(0[xXoObB][\da-fA-F_]+|\d[\d_]*\.?\d*(?:[eE][+-]?\d+)?j?|\.\d+)|([A-Za-z_\u0080-\uFFFF][\w\u0080-\uFFFF]*)|([\s\S])/g;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function highlight(src){
 let o="",prev="",m;RX.lastIndex=0;
 while((m=RX.exec(src))){
  const x=m[0];
  if(m[1])o+=`<span class="cm_">${esc(x)}</span>`;
  else if(m[2])o+=`<span class="st">${esc(x)}</span>`;
  else if(m[3])o+=`<span class="dc">${esc(x)}</span>`;
  else if(m[4])o+=`<span class="nu">${esc(x)}</span>`;
  else if(m[5]){
   let c="";
   if(prev==="def")c="fn";else if(prev==="class")c="cl";
   else if(KW.has(x))c=(x==="True"||x==="False"||x==="None")?"cn":"kw";
   else if(x==="self"||x==="cls")c="sf";
   else if(BI.has(x))c="bi";
   else if(src[RX.lastIndex]==="(")c="fn";
   o+=c?`<span class="${c}">${esc(x)}</span>`:esc(x);prev=x;continue;
  }else o+=esc(x);
  if(!/^\s$/.test(x))prev="";
 }
 return o+"\n";
}

/* ---------- editor ---------- */
const ed=$("ed"),hl=$("hl"),gut=$("gut");
function render(){
 hl.innerHTML=highlight(ed.value);
 const n=ed.value.split("\n").length;
 if(gut.dataset.n!=n){gut.dataset.n=n;gut.textContent=Array.from({length:n},(_,i)=>i+1).join("\n")}
 S.tabs[S.cur].code=ed.value;save();
}
ed.addEventListener("input",render);
const ins=s=>{ed.focus();document.execCommand("insertText",false,s)};
ed.addEventListener("beforeinput",e=>{
 if(e.isComposing)return;
 if(e.inputType==="insertLineBreak"||e.inputType==="insertParagraph"){
  e.preventDefault();
  const p=ed.selectionStart,b=ed.value.slice(0,p),line=b.slice(b.lastIndexOf("\n")+1);
  let ind=line.match(/^[ \t]*/)[0];
  if(/:\s*$/.test(line))ind+="    ";
  ins("\n"+ind);return;
 }
 if(e.inputType==="insertText"&&S.auto&&e.data&&e.data.length===1){
  const pairs={"(":")","[":"]","{":"}",'"':'"',"'":"'"},c=e.data,nx=ed.value[ed.selectionStart];
  if(")]}\"'".includes(c)&&nx===c&&ed.selectionStart===ed.selectionEnd){e.preventDefault();ed.setSelectionRange(ed.selectionStart+1,ed.selectionStart+1);return}
  if(pairs[c]&&(!nx||/[\s)\]}:,]/.test(nx))&&ed.selectionStart===ed.selectionEnd){
   const prev=ed.value[ed.selectionStart-1];
   if((c==='"'||c==="'")&&prev&&/[\w\u0080-\uFFFF]/.test(prev))return;
   e.preventDefault();ins(c+pairs[c]);ed.setSelectionRange(ed.selectionStart-1,ed.selectionStart-1);
  }
 }
});
ed.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();e.shiftKey?dedent():ins("    ")}});
function dedent(){const p=ed.selectionStart,s=ed.value.lastIndexOf("\n",p-1)+1,m=ed.value.slice(s).match(/^( {1,4}|\t)/);if(m){ed.setSelectionRange(s,s+m[0].length);ins("")}}
function load(){ed.value=S.tabs[S.cur].code;render();drawTabs()}
function drawTabs(){
 const el=$("tabs");el.innerHTML="";
 S.tabs.forEach((tb,i)=>{const d=document.createElement("div");d.className="tab"+(i===S.cur?" on":"");d.dir="ltr";
  d.innerHTML=`<span>${esc(tb.name)}</span><b>✕</b>`;
  d.onclick=ev=>{if(ev.target.tagName==="B"){if(S.tabs.length>1){S.tabs.splice(i,1);S.cur=Math.min(S.cur,S.tabs.length-1);if(i<S.cur)S.cur--;load()}}else{S.cur=i;load()}};
  el.appendChild(d)});
}

/* ---------- keys bar ---------- */
["Tab","(",")","[","]","{","}",'"',"'",":","=","#","_",".",",","+","-","*","/","%","<",">","!","&","|","\\","@","$"].forEach(k=>{
 const b=document.createElement("button");b.textContent=k==="Tab"?"⇥":k;
 b.addEventListener("pointerdown",e=>e.preventDefault());
 b.onclick=()=>ins(k==="Tab"?"    ":k);$("keys").appendChild(b)});

/* ---------- actions ---------- */
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function showPanel(){$("panel").classList.add("show")}
function onOutput(s){$("out").textContent=s||"";$("out").scrollTop=1e9}
function onTerm(s){$("out").textContent+=s+"\n";$("out").scrollTop=1e9}
window.onFile=(name,code)=>{S.tabs.push({name,code});S.cur=S.tabs.length-1;load()};
const A=()=>window.Android||null;
$("bRun").onclick=()=>{showPanel();if(!A())return onOutput(t("nopy"));onOutput("…");A().run(ed.value,S.tabs[S.cur].name)};
$("bNew").onclick=()=>{S.tabs.push(newTab());S.cur=S.tabs.length-1;load()};
$("bOpen").onclick=()=>A()?A().openFile():toast(t("nopy"));
$("bSave").onclick=()=>A()?A().saveAs(S.tabs[S.cur].name,ed.value):toast(t("nopy"));
$("bUndo").onclick=()=>{ed.focus();document.execCommand("undo")};
$("bRedo").onclick=()=>{ed.focus();document.execCommand("redo")};
$("bTerm").onclick=()=>{showPanel();$("ti").focus()};
$("bX").onclick=()=>$("panel").classList.remove("show");
$("bClr").onclick=()=>$("out").textContent="";
const go=()=>{const v=$("ti").value.trim();if(!v)return;$("ti").value="";$("out").textContent+="$ "+v+"\n";A()?A().pip(v):onTerm(t("nopy"))};
$("bGo").onclick=go;$("ti").addEventListener("keydown",e=>{if(e.key==="Enter")go()});

/* ---------- settings ---------- */
function applySettings(){
 document.documentElement.dataset.theme=S.theme;
 document.documentElement.style.setProperty("--fs",S.size+"px");
 document.documentElement.lang=S.lang;
 document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 $("wrap").dir="ltr";$("keys").dir="ltr";$("tabs").dir="ltr";
 $("bRun").title=t("run");$("tOut").textContent=t("out");$("bClr").textContent=t("clear");
 $("sTitle").textContent=t("set");$("sLang").textContent=t("lang");$("sTheme").textContent=t("theme");
 $("sSize").textContent=t("size");$("sAuto").textContent=t("auto");$("sOk").textContent=t("ok");
 $("oLang").value=S.lang;$("oTheme").value=S.theme;$("oSize").value=S.size;$("oAuto").checked=S.auto;
 save();
}
$("bSet").onclick=()=>$("modal").classList.add("show");
$("sOk").onclick=()=>{S.lang=$("oLang").value;S.theme=$("oTheme").value;S.size=Math.min(30,Math.max(10,+$("oSize").value||15));S.auto=$("oAuto").checked;applySettings();$("modal").classList.remove("show")};
applySettings();load();
</script></body></html>
