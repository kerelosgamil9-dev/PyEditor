plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

// ---- release signing -------------------------------------------------------
// 1) If the CI passes a keystore (GitHub secrets, see README) it is used  -> use this for Google Play.
// 2) Otherwise the keystore in the repo root is used, so every new APK still installs over the old one.
def envKs = System.getenv("PYVORA_KEYSTORE_FILE")
def repoKs = rootProject.file('debug.keystore')
def useEnvKs = envKs != null && !envKs.isEmpty() && file(envKs).exists()
def hasReleaseKey = useEnvKs || repoKs.exists()

android {
    namespace 'com.pyeditor'
    compileSdk 36

    defaultConfig {
        applicationId "com.pyeditor"
        minSdk 24
        targetSdk 36            // Google Play requires API 36 for new apps and updates (since 31 Aug 2026)
        // every GitHub build gets a higher versionCode (run number), so Android installs it as an UPDATE over the old one
        versionCode 100 + ((System.getenv("GITHUB_RUN_NUMBER") ?: "0") as int)
        versionName "1.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        python {
            version "3.11"
            pip { install "pip" }
        }
    }

    buildFeatures { buildConfig true }

    // play : no "All files access" permission  -> allowed on Google Play, no scary permission for Play Protect
    // full : same app + "All files access"     -> old behaviour (files in the main phone storage), sideload only
    flavorDimensions "dist"
    productFlavors {
        play {
            dimension "dist"
            buildConfigField "boolean", "ALL_FILES", "false"
        }
        full {
            dimension "dist"
            buildConfigField "boolean", "ALL_FILES", "true"
        }
    }

    signingConfigs {
        release {
            if (useEnvKs) {
                storeFile file(envKs)
                storePassword System.getenv("PYVORA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PYVORA_KEY_ALIAS")
                keyPassword System.getenv("PYVORA_KEY_PASSWORD")
            } else if (repoKs.exists()) {
                storeFile repoKs
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (repoKs.exists()) {
            debug {
                storeFile repoKs
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false        // keep it off: Chaquopy + JavascriptInterface need no shrinking
            shrinkResources false
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
}
