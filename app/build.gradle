plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}
android {
    namespace 'com.pyeditor'
    compileSdk 34
    defaultConfig {
        applicationId "com.pyeditor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        python {
            version "3.11"
            pip { install "pip" }
        }
    }
    // fixed signing key (if debug.keystore exists in the repo root) so every new APK installs over the old one
    def pyvoraKs = rootProject.file('debug.keystore')
    if (pyvoraKs.exists()) {
        signingConfigs {
            debug {
                storeFile pyvoraKs
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
}
