name: TK Phase0 (AndroWish recon + build)
# Manual only: Actions tab -> "TK Phase0" -> Run workflow
on: workflow_dispatch

jobs:
  tk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Tool info
        run: |
          set +e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null
          "$ANDROID_NDK_HOME/ndk-build" --version 2>&1 | head -3
          which fossil ant make autoconf || true

      - name: Download AndroWish source (fixed release c48f047f5b)
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcl bc zip file
          mkdir -p $HOME/work && cd $HOME/work
          curl -fSL -o src.tar.gz http://androwish.org/download/androwish-c48f047f5b.tar.gz
          ls -la src.tar.gz; file src.tar.gz
          echo "4ecbc23193cb00b9fc34c0942e2327f0b6badbe587ab574b492780994707683d  src.tar.gz" | sha256sum -c - || echo "CHECKSUM MISMATCH (continuing)"
          mkdir -p src && tar xzf src.tar.gz -C src
          ls src
          echo "androwish-c48f047f5b" > links.txt

      - name: Recon (jni tree and module names)
        run: |
          set +e
          cd $HOME/work/src
          D=$(find . -maxdepth 2 -name jni -type d | head -1); D=$(cd "$(dirname "$D")" && pwd)
          echo "PROJECT=$D"; echo "$D" > /tmp/projdir
          cd "$D"
          ls
          echo "---- jni ----"; ls jni
          echo "---- Application.mk ----"; cat jni/Application.mk
          echo "---- modules (tcl / tk / sdl) ----"
          grep -rhE '^\s*LOCAL_MODULE\s*:?=' jni --include=Android.mk | grep -iE 'tcl|tk|sdl|freetype|agg|png|jpeg|z\b' | sort -u | head -80
          echo "---- python / tkinter hints ----"
          grep -rl "tkinter" . 2>/dev/null | head

      - name: Build native libs (arm64-v8a, keep going on errors)
        run: |
          set +e
          cd $(cat /tmp/projdir)
          export PATH="$ANDROID_NDK_HOME:$PATH"
          ndk-build -k -j4 APP_ABI=arm64-v8a APP_PLATFORM=android-24 2>&1 | tee $HOME/work/ndk-build.log | tail -n 60
          echo "---- produced libs ----"
          find libs -name '*.so' | sort | tee $HOME/work/libs.txt | head -100
          echo "count: $(wc -l < $HOME/work/libs.txt)"
          echo "---- errors ----"
          grep -nE "error:|Error [0-9]|\*\*\* " $HOME/work/ndk-build.log | head -60

      - name: Collect
        if: always()
        run: |
          set +e
          cd $HOME/work
          mkdir -p out
          cp ndk-build.log libs.txt links.txt out/ 2>/dev/null
          cp -r $(cat /tmp/projdir)/libs out/libs 2>/dev/null
          cp $(cat /tmp/projdir)/jni/Application.mk out/ 2>/dev/null
          (cd $(cat /tmp/projdir) && find jni -name Android.mk | sort) > out/android_mk_list.txt
          ls -R out | head -50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tk-phase0
          path: ~/work/out
          if-no-files-found: warn
